name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the weekly workflow run exactly these checks.
  workflow_call:

jobs:
  checks:
    # Windows is included because that is where development happens.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Check formatting
        run: uv run ruff format --check
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov

  commit-messages:
    # Only pushes and pull requests bring new commits to check.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Check commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run --no-project python tools/check_commits.py "$BASE" "$HEAD"
