name: Release

# Pushing a tag such as v0.5.0 publishes a GitHub release with that version's
# CHANGELOG.md section. Run it by hand to publish a release for an older tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish a release for, e.g. v0.4.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v6
      - name: Release notes from CHANGELOG.md
        run: uv run --no-project python tools/release_notes.py "$TAG" --output notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --verify-tag --title "RAGnosis ${TAG#v}" --notes-file notes.md
