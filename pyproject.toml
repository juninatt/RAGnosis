[project]
name = "ragnosis"
version = "0.1.0"
description = "A free, local RAG assistant grounded in Wikipedia and Wikidata."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
ragnosis = "ragnosis.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

# uv's own backend builds without starting Python, which Windows Smart App Control
# can block when it runs from a temporary build folder.
[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests hit real services (Wikipedia, Ollama) and are opt-in: `pytest -m integration`.
addopts = ["-ra", "--strict-markers", "-m", "not integration"]
markers = ["integration: talks to real external services; deselected by default"]

[tool.coverage.run]
source = ["ragnosis"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# T20 bans print() so all output goes through logging.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "PT", "T20"]

[tool.mypy]
strict = true
files = ["src", "tests"]
